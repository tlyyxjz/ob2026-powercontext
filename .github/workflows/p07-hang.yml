name: p07-hang

on:
  workflow_dispatch:
  push:
    branches:
      - 2026-competition
    paths:
      - ".github/workflows/p07-hang.yml"

permissions:
  contents: read

jobs:
  hang:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: p07-hang-stack
    # Every variable the matrix job sets is reproduced here. The first attempt
    # omitted POWERCONTEXT_CANDIDATE / POWERCONTEXT_PUBLIC and ran from
    # competition/ instead of the repo root; it hung 5/5, which was the missing
    # environment rather than the product.
    env:
      POWERCONTEXT_CANDIDATE: ${{ github.workspace }}
      POWERCONTEXT_PUBLIC: ${{ github.workspace }}/competition
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/competition
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONFAULTHANDLER: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked competition dependencies
        run: python -m pip install -r competition/requirements.txt
      - name: Repeat the count-trigger acceptance and dump stacks if it hangs
        run: |
          for round in 1 2 3; do
            echo "=== round $round $(date -u +%H:%M:%S) ==="
            timeout -s SIGABRT 240 python -m pytest -q -c competition/pytest.ini               --confcutdir=competition               competition/challenges/processing-01-count-trigger/acceptance 2>&1 | tail -200
            echo "round $round exit: ${PIPESTATUS[0]}"
          done
