name: p07-hang

on:
  workflow_dispatch:
  push:
    branches:
      - 2026-competition
    paths:
      - ".github/workflows/p07-hang.yml"

permissions:
  contents: read

jobs:
  hang:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: p07-hang-stack
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/competition
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked competition dependencies
        run: python -m pip install -r competition/requirements.txt
      - name: Repeat the count-trigger acceptance and dump stacks if it hangs
        working-directory: competition
        run: |
          for round in 1 2 3 4 5; do
            echo "=== round $round $(date -u +%H:%M:%S) ==="
            timeout -s SIGABRT 240 python -m pytest -q -c pytest.ini --confcutdir=.               challenges/processing-01-count-trigger/acceptance 2>&1 | tail -40
            echo "round $round exit: ${PIPESTATUS[0]}"
          done
