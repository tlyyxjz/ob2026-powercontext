name: competition-self-test

on:
  workflow_dispatch:
  push:
    branches:
      - 2026-competition
    paths:
      - "src/**"
      - "tests/**"
      - "competition/**"
      - ".github/workflows/competition-self-test.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        challenge:
          - source-01-table-evidence
          - source-02-pi-history
          - context-01-evidence-selection
    name: ${{ matrix.challenge }}
    env:
      POWERCONTEXT_CANDIDATE: ${{ github.workspace }}
      POWERCONTEXT_PUBLIC: ${{ github.workspace }}/competition
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/competition
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked competition dependencies
        run: python -m pip install -r competition/requirements.txt
      - name: Run published acceptance suite
        run: >-
          python -m pytest -q
          -c competition/pytest.ini
          --confcutdir=competition
          competition/challenges/${{ matrix.challenge }}/acceptance

  product-contract:
    runs-on: ubuntu-24.04
    name: product-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked competition dependencies
        run: python -m pip install -r competition/requirements.txt
      - name: Run product-side contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONHASHSEED: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          TZ: UTC
        run: >-
          python -m pytest -q
          tests/test_pi_session_source.py
          tests/test_evidence_fragments.py
          tests/builtin/runtime/test_prepared_context.py
          tests/builtin/runtime/test_statistics.py
