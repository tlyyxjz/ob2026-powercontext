name: p07-txn

on:
  workflow_dispatch:
  push:
    branches:
      - 2026-competition
    paths:
      - ".github/workflows/p07-txn.yml"
      - "src/powercontext/builtin/runtime/artifact_processing.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    name: p07-txn-timing
    env:
      POWERCONTEXT_CANDIDATE: ${{ github.workspace }}
      POWERCONTEXT_PUBLIC: ${{ github.workspace }}/competition
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/competition
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked competition dependencies
        run: python -m pip install -r competition/requirements.txt
      - name: Count-trigger acceptance with transaction timing
        run: |
          for round in 1 2 3; do
            echo "===== round $round $(date -u +%H:%M:%S) ====="
            python -m pytest -q -c competition/pytest.ini --confcutdir=competition \
              -p selftest_support.p07_txnprobe \
              competition/challenges/processing-01-count-trigger/acceptance 2>&1 | tail -60
          done
